# cohomolo-gy Architecture
# Generated by /planning skill on 2026-09-03

system:
  name: cohomolo-gy
  type: frontend
  description: Static Astro 7 site for https://cohomolo.gy, built to dist/ and served by GitHub Pages.

components:
  - id: content
    name: Content collections
    type: library
    description: Markdown/MDX posts and notes, YAML projects and talks, About page; typed by src/content.config.ts (c-content-schema).
    owns: [src/content/**, src/content.config.ts, src/lib/content.ts]

  - id: config
    name: Site configuration
    type: library
    description: Single module exporting identity, nav, and links (c-site-config).
    owns: [src/site.config.ts]

  - id: markdown
    name: Markdown pipeline
    type: library
    description: "@astrojs/markdown-remark unified() with remark-math, rehype-katex, rehype-slug, rehype-autolink-headings; Shiki dual-theme (D-14, D-9)."
    owns: [astro.config.mjs#markdown]

  - id: design
    name: Design system
    type: component
    description: Tokens, global/prose CSS, fonts (c-design-tokens, D-13, D-15).
    owns: [src/styles/**]

  - id: shell
    name: Layouts and components
    type: component
    description: BaseLayout, ArticleLayout, Header/Footer/ThemeToggle and content components (c-components).
    owns: [src/layouts/**, src/components/**]

  - id: pages
    name: Routes
    type: page
    description: Homepage, section indexes, entry pages, tags, about, 404 (c-routes).
    routes: ["/", "/posts/", "/posts/[id]/", "/notes/", "/notes/[id]/", "/tags/", "/tags/[tag]/", "/projects/", "/talks/", "/about/", "/404"]
    owns: [src/pages/**/*.astro]

  - id: feeds
    name: Feeds and OG
    type: page
    description: rss.xml endpoint, per-entry OG PNG endpoints via satori + resvg, default OG image script.
    routes: ["/rss.xml", "/og/posts/[id].png", "/og/notes/[id].png"]
    owns: [src/pages/rss.xml.ts, src/pages/og/**, src/lib/og.ts, src/lib/feed.ts, scripts/og-default.mjs]

  - id: tooling
    name: Scripts and CI
    type: service
    description: check-links, new-entry scaffolder, GitHub Actions deploy, Dependabot.
    owns: [scripts/**, .github/**]

  - id: docs
    name: Documentation
    type: library
    description: README + docs/ for writing, styling, deploying, maintaining.
    owns: [README.md, docs/**]

connections:
  - { from: pages,  to: content,  type: reads,  protocol: internal, data: collection entries via getCollection/render }
  - { from: pages,  to: shell,    type: calls,  protocol: internal, data: layout + component props (c-components) }
  - { from: shell,  to: config,   type: reads,  protocol: internal, data: SITE }
  - { from: shell,  to: design,   type: reads,  protocol: internal, data: CSS tokens + utility classes }
  - { from: content,to: markdown, type: calls,  protocol: internal, data: md/mdx → HTML + headings }
  - { from: feeds,  to: content,  type: reads,  protocol: internal, data: published posts/notes }
  - { from: feeds,  to: config,   type: reads,  protocol: internal, data: SITE.url, title, author }
  - { from: tooling,to: external/github-pages, type: writes, protocol: https, data: dist/ artifact }

external:
  - id: github-pages
    name: GitHub Pages
    type: service
    url: https://cohomolo.gy
    auth: GitHub OIDC (actions/deploy-pages)
  - id: registrar-dns
    name: Domain registrar DNS
    type: service
    auth: Emily, manual

auth_boundaries: []

data_stores:
  - id: theme-pref
    name: Theme preference
    type: localStorage
    stores: ["theme: 'light' | 'dark'"]
