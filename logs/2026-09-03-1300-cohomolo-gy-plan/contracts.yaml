# cohomolo-gy Interface Contracts
# Generated by /planning skill on 2026-09-03
# Schema: ~/llmephant/skills/planning/schema/contracts.md
#
# All contracts are FROZEN before wave 2 fan-out. An implementer who finds
# a contract wrong logs the conflict and stops at that boundary.

contracts:
  # ---------------------------------------------------------------------
  - id: c-content-schema
    name: Content collections
    kind: file-format
    producer: p1
    consumers: [p2, p3, p4, p5, p6]
    frozen: true
    definition: |
      File: src/content.config.ts
      Imports: { defineCollection } from 'astro:content'; { glob, file } from 'astro/loaders'; { z } from 'astro/zod'

      posts   — glob({ pattern: '**/[^_]*.{md,mdx}', base: './src/content/posts' })
        schema:
          title:       z.string().min(1).max(120)
          description: z.string().min(1).max(280)      # used for meta + cards + feed
          date:        z.coerce.date()                  # publication date
          updated:     z.coerce.date().optional()
          tags:        z.array(z.string().regex(/^[a-z0-9]+(-[a-z0-9]+)*$/)).default([])
          draft:       z.boolean().default(false)       # drafts render in dev, excluded from build/feed/sitemap
          math:        z.boolean().default(false)       # true → load KaTeX CSS on this page
          toc:         z.boolean().default(true)        # show table of contents when ≥3 h2/h3
          lede:        z.string().optional()            # optional oversized opening paragraph shown above body

      notes   — glob({ pattern: '**/[^_]*.{md,mdx}', base: './src/content/notes' })
        schema: same as posts minus `lede` and `toc` (toc always false for notes)

      projects — file('./src/content/projects.yaml')   # top-level YAML list; each item:
          id:          z.string()                        # kebab, unique
          name:        z.string()
          description: z.string().max(200)
          url:         z.string().url()                  # primary link
          repo:        z.string().url().optional()
          hackage:     z.string().optional()             # package name → https://hackage.haskell.org/package/<name>
          role:        z.enum(['author','maintainer','contributor','founder'])
          status:      z.enum(['active','maintained','archived','wip'])
          tags:        z.array(z.string()).default([])
          featured:    z.boolean().default(false)        # featured items appear on the homepage

      talks    — file('./src/content/talks.yaml')       # top-level YAML list; each item:
          id:          z.string()
          title:       z.string()
          kind:        z.enum(['talk','paper','slides','workshop','panel'])
          venue:       z.string()                        # e.g. "Scalaworld 2019", "Compositionality vol. 6"
          date:        z.coerce.date()
          url:         z.string().url().optional()
          slides:      z.string().url().optional()
          video:       z.string().url().optional()
          coauthors:   z.array(z.string()).default([])
          abstract:    z.string().optional()

      about    — glob({ pattern: 'about.md', base: './src/content/pages' })
        schema: { title: z.string(), description: z.string() }

      export const collections = { posts, notes, projects, talks, about }

      Entry ids: for glob collections the id is the file path minus extension,
      e.g. src/content/posts/kitchen-sink.md → id "kitchen-sink". Nested
      folders produce "2026/foo". Files beginning with "_" are ignored, which
      is how _template.md files live beside content.
    notes: |
      Helper (src/lib/content.ts, owned by p1, consumed by everyone):
        getPublishedPosts(): Promise<CollectionEntry<'posts'>[]>   // draft filtered when import.meta.env.PROD, sorted date desc
        getPublishedNotes(): Promise<CollectionEntry<'notes'>[]>
        getAllTags(): Promise<{ tag: string; count: number }[]>    // across posts+notes, sorted by count desc then name
        isPublished(entry): boolean                                // !draft || import.meta.env.DEV
      Drafts: `astro dev` shows drafts with a visible "DRAFT" badge (p3); `astro build` excludes them.

  # ---------------------------------------------------------------------
  - id: c-site-config
    name: Site configuration module
    kind: module-api
    producer: p1
    consumers: [p2, p4, p5, p6]
    frozen: true
    definition: |
      File: src/site.config.ts  (values from registry C-5)
      export const SITE = {
        title: string,             // "cohomolo.gy"
        tagline: string,           // short phrase used under the wordmark, ≤ 60 chars
        description: string,       // ≤ 160 chars, default meta description
        url: string,               // "https://cohomolo.gy"
        author: { name: string; email: string; bio: string },
        locale: 'en',
        nav: Array<{ label: string; href: string }>,        // order = header order
        links: Array<{ label: string; href: string; icon: 'github'|'hackage'|'linkedin'|'mail'|'rss'|'org' }>,
        postsPerPage: 20,          // not paginated in v1; reserved
        homepage: { recentPosts: 5; recentNotes: 4; featuredProjects: 3 },
      } as const;
      nav = [ Writing → /posts/, Notes → /notes/, Projects → /projects/, Talks → /talks/, About → /about/ ]
    notes: |
      This is the ONE file Emily edits to change her name, bio, links, or nav.
      docs/README must point at it.

  # ---------------------------------------------------------------------
  - id: c-design-tokens
    name: CSS design tokens
    kind: file-format
    producer: p2
    consumers: [p4, p6]
    frozen: true
    definition: |
      File: src/styles/tokens.css. All custom properties defined on :root
      (dark values) and overridden under :root[data-theme="light"].
      The `prefers-color-scheme: light` media query applies the light set
      ONLY when [data-theme] is absent (first visit, no stored choice).

      /* colour — dark defaults */
      --color-bg:            #0b0d14;   /* void */
      --color-bg-elevated:   #12151f;   /* cards, code */
      --color-bg-inset:      #080a10;   /* inset wells */
      --color-text:          #e7e4dc;   /* warm paper */
      --color-text-muted:    #9a9db0;
      --color-text-faint:    #626678;
      --color-rule:          #22263a;   /* hairlines */
      --color-accent:        #8fb3ff;   /* indigo-glow: links */
      --color-accent-2:      #5fe3c9;   /* teal: highlights, active */
      --color-accent-3:      #c4a6ff;   /* violet: italics/callout-idea */
      --color-warn:          #ffb86b;
      --color-selection:     rgba(143,179,255,.28);
      --gradient-aurora:     linear-gradient(120deg, var(--color-accent) 0%, var(--color-accent-2) 55%, var(--color-accent-3) 100%);

      /* colour — light overrides */
      --color-bg: #f7f4ec; --color-bg-elevated: #fffdf7; --color-bg-inset: #efece3;
      --color-text: #1b1c24; --color-text-muted: #5b5e70; --color-text-faint: #8d90a0;
      --color-rule: #dcd8cc; --color-accent: #3552c9; --color-accent-2: #0f8f7a;
      --color-accent-3: #6a45c8; --color-warn: #b45f06; --color-selection: rgba(53,82,201,.18);

      /* type */
      --font-display: 'Newsreader Variable', 'Iowan Old Style', Georgia, serif;
      --font-body:    'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono:    'JetBrains Mono Variable', ui-monospace, 'SF Mono', Menlo, monospace;
      --text-xs: .75rem; --text-sm: .875rem; --text-base: 1.0625rem; --text-lg: 1.25rem;
      --text-xl: 1.5rem; --text-2xl: 2rem; --text-3xl: 2.75rem; --text-4xl: clamp(2.75rem, 6vw, 4rem);
      --leading-tight: 1.15; --leading-body: 1.65;
      --tracking-label: .08em;                      /* mono section labels, uppercase */

      /* layout */
      --measure: 68ch;                              /* prose width */
      --measure-wide: 84ch;                         /* lists, homepage */
      --gutter: clamp(1rem, 4vw, 2.5rem);
      --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem;
      --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem; --space-24: 6rem;
      --radius-sm: 4px; --radius-md: 8px; --radius-lg: 14px;
      --shadow-glow: 0 0 0 1px var(--color-rule), 0 12px 40px -20px var(--color-accent);
      --ease-out: cubic-bezier(.16,1,.3,1); --dur: 180ms;

      /* code (Shiki dual theme) */
      .astro-code { background: var(--color-bg-elevated) !important; }
      :root[data-theme="light"] .astro-code, :root[data-theme="light"] .astro-code span
        { color: var(--shiki-light) !important; }
      /* dark is the default emitted colour; light overrides via variables above */

      Utility classes provided by src/styles/global.css (consumers may rely on these names):
        .container      max-width var(--measure-wide); padding-inline var(--gutter); margin-inline auto
        .prose          typographic styles for rendered Markdown (headings, lists, blockquote, code, tables, footnotes, katex, figure)
        .label          mono, uppercase, tracking-label, text-xs, muted   → used for "§ writing", dates, tags
        .hairline       1px top border color-rule
        .visually-hidden
        .link-plain     removes underline; underline on hover
      Every focusable element shows :focus-visible { outline: 2px solid var(--color-accent-2); outline-offset: 2px }.
    notes: |
      Consumers never hard-code colours, font families, or spacing: tokens only.
      p2 may ADD tokens; it may not rename or remove any listed here.

  # ---------------------------------------------------------------------
  - id: c-components
    name: Shared layout and component API
    kind: module-api
    producer: p2
    consumers: [p4, p6]
    frozen: true
    definition: |
      src/layouts/BaseLayout.astro
        Props { title: string; description?: string; ogImage?: string /* absolute or site-relative */; type?: 'website'|'article'; math?: boolean; publishedTime?: Date; modifiedTime?: Date; noindex?: boolean }
        Renders <html lang data-theme?> <head> (SEO meta, OG/Twitter, canonical, RSS alternate, sitemap link, favicon, fonts, theme script, KaTeX CSS when math) <Header/> <main id="main"><slot/></main> <Footer/>.
        Sets <title> as `${title} · ${SITE.title}` except on the homepage where it is SITE.title.
        Default ogImage: /og/default.png (static file in public/og/default.png, produced by p6).

      src/layouts/ArticleLayout.astro
        Props { entry: CollectionEntry<'posts'> | CollectionEntry<'notes'>; headings: MarkdownHeading[]; collection: 'posts'|'notes' }
        Wraps BaseLayout(type='article', math=entry.data.math, ogImage=`/og/${collection}/${entry.id}.png`),
        renders: header (label "§ writing"/"§ note", h1, description, FormattedDate, reading time, TagList, DRAFT badge in dev),
        optional lede, optional <TableOfContents> when entry.data.toc && headings.filter(h=>h.depth<=3).length >= 3,
        <article class="prose"><slot/></article>, footer nav (← newer / older →) via props prev/next optional.

      src/components/Header.astro          — wordmark (∂ monogram + "cohomolo.gy"), nav from SITE.nav, ThemeToggle, aria-current on active
      src/components/Footer.astro          — SITE.links as icon links, "∂² = 0", © year Emily Pillmore, RSS
      src/components/ThemeToggle.astro     — button[aria-label], swaps data-theme, persists localStorage 'theme'; inline script, no framework
      src/components/FormattedDate.astro   — Props { date: Date; format?: 'long'|'short'|'iso' } → <time datetime>
      src/components/TagList.astro         — Props { tags: string[]; linked?: boolean } → links to /tags/<tag>/
      src/components/PostList.astro        — Props { entries: Array<CollectionEntry<'posts'>|CollectionEntry<'notes'>>; collection: 'posts'|'notes'; showDescription?: boolean } → <ol> of title/date/description
      src/components/TableOfContents.astro — Props { headings: MarkdownHeading[]; maxDepth?: 2|3 }
      src/components/Callout.astro         — Props { kind?: 'note'|'idea'|'warn'|'math'|'aside'; title?: string } with <slot/>; usable from MDX
      src/components/Figure.astro          — Props { src: ImageMetadata|string; alt: string; caption?: string; width?: number }
      src/components/Constellation.astro   — decorative inline SVG, aria-hidden, Props { seed?: number; density?: 'low'|'mid' }
      src/components/SectionHeading.astro  — Props { label: string /* "§ writing" */; title?: string; href?: string; more?: string /* "all writing →" */ }
      src/components/ProjectCard.astro     — Props { project: CollectionEntry<'projects'>['data'] }
      src/components/TalkItem.astro        — Props { talk: CollectionEntry<'talks'>['data'] }

      src/lib/format.ts
        formatDate(d: Date, fmt?: 'long'|'short'|'iso'): string      // long → "3 September 2026"
        readingTime(body: string): { minutes: number; words: number } // 230 wpm, rounds up, min 1
        slugifyTag(tag: string): string
      src/lib/url.ts
        href(path: string): string   // ensures leading and trailing slash for internal dirs; passthrough for files/external
        absolute(path: string): string  // new URL(path, SITE.url).toString()
    notes: |
      p4 builds pages ONLY from these components plus the primitives
      (.prose, .label, .container, .hairline). If a page needs a component
      that does not exist, p4 composes it from primitives inside the page
      file and logs the gap; it does not add files under src/components/.

  # ---------------------------------------------------------------------
  - id: c-routes
    name: Route table
    kind: http-api
    producer: p4
    consumers: [p5, p6, p7]
    frozen: true
    definition: |
      Owner p2:  /                       homepage (hero, recent posts, recent notes, featured projects)
      Owner p4:  /posts/                 all published posts, date desc, grouped by year
                 /posts/[id]/            one post (ArticleLayout)
                 /notes/                 all published notes
                 /notes/[id]/            one note (ArticleLayout)
                 /tags/                  tag index with counts
                 /tags/[tag]/            posts+notes with tag
                 /projects/              grouped by status: active, maintained, wip, archived
                 /talks/                 reverse-chronological, grouped by year
                 /about/                 renders content/pages/about.md in .prose, plus links
                 /404                    styled not-found (src/pages/404.astro)
      Owner p6:  /rss.xml                posts + notes, 20 newest, full HTML content sanitized
                 /og/posts/[id].png      1200×630 PNG per published post
                 /og/notes/[id].png      1200×630 PNG per published note
                 /og/default.png         static (public/og/default.png), generated once by p6's script
      Owner p1:  /sitemap-index.xml      @astrojs/sitemap (drafts excluded via filter)
                 /robots.txt             public/robots.txt → Sitemap: https://cohomolo.gy/sitemap-index.xml
      All directory routes end with "/" (D-18). Draft entries never get a route in PROD builds.

  # ---------------------------------------------------------------------
  - id: c-scripts
    name: package.json scripts
    kind: module-api
    producer: p1
    consumers: [p2, p3, p4, p5, p6, p7]
    frozen: true
    definition: |
      "dev":        "astro dev"
      "build":      "astro build"
      "preview":    "astro preview"
      "check":      "astro check"
      "format":     "prettier --write ."
      "format:check": "prettier --check ."
      "lint:links": "node scripts/check-links.mjs dist"
      "new:post":   "node scripts/new.mjs post"      # scaffolds src/content/posts/<slug>.md from _template.md, prompts for title
      "new:note":   "node scripts/new.mjs note"
      "og:default": "node scripts/og-default.mjs"    # p6: writes public/og/default.png
      "verify":     "npm run check && npm run build && npm run lint:links"
    notes: |
      scripts/check-links.mjs: walks dist/**/*.html, collects href/src that are
      site-relative, asserts each target exists as a file or dir/index.html;
      ignores mailto:, http(s):, #fragments; exits 1 on any miss with a list.
      Zero dependencies (node:fs, node:path, a small regex — no HTML parser needed).
