# cohomolo-gy Work Packages
# Generated by /planning skill on 2026-09-03
# Schema: ~/llmephant/skills/planning/schema/packages.md

campaign:
  name: cohomolo-gy
  plan: logs/2026-09-03-1300-cohomolo-gy-plan
  mode: orchestrated

execution:
  orchestrator: fable
  default_tier: opus
  max_fix_rounds: 2

packages:
  - id: p1
    name: Scaffold, config, content schema, CI
    kind: build
    depends_on: []
    weight: medium
    tier: opus
    isolation: in-place
    scope:
      files:
        - package.json
        - package-lock.json
        - astro.config.mjs
        - tsconfig.json
        - .nvmrc
        - .gitignore
        - .prettierrc
        - .prettierignore
        - .editorconfig
        - .github/**
        - public/CNAME
        - public/robots.txt
        - public/favicon.svg
        - src/content.config.ts
        - src/site.config.ts
        - src/lib/content.ts
        - src/lib/format.ts
        - src/lib/url.ts
        - src/env.d.ts
        - src/styles/global.css      # stub only: imports tokens.css + fonts.css
        - src/styles/tokens.css      # stub only: empty with a comment; p2 fills
        - src/styles/fonts.css       # fontsource imports (D-15)
        - src/pages/index.astro      # placeholder that p2 replaces
        - src/content/**/_template.md
        - src/content/projects.yaml  # empty list []
        - src/content/talks.yaml     # empty list []
        - src/content/pages/about.md # placeholder frontmatter + one line
        - scripts/check-links.mjs
        - scripts/new.mjs
      not:
        - any real styling (p2)
        - any real content (p3)
        - pages beyond the placeholder index (p4)
        - README and docs (p5)
        - rss/og endpoints (p6)
    contracts: [c-content-schema, c-site-config, c-scripts]
    skills: [/style-guide-typescript]
    brief: briefs/p1.md
    log: logs/2026-09-03-1300-cohomolo-gy-plan/agent-logs/p1/
    tests_first:
      - "scripts/check-links.mjs exits 1 on a dist fixture with one dangling href and 0 on a clean one (self-test via `node scripts/check-links.mjs --self-test`)"
    verify:
      - cmd: npm run check
        expect: exit 0
      - cmd: npm run build
        expect: exit 0
      - cmd: node scripts/check-links.mjs --self-test
        expect: exit 0
      - cmd: test -f public/CNAME && grep -qx 'cohomolo.gy' public/CNAME
        expect: exit 0
      - cmd: git -C . log --oneline | grep -c .
        expect: output ≥ 1 (repo initialised on branch main with an initial commit)

  - id: p2
    name: Design system, layouts, components, homepage
    kind: build
    depends_on: [p1]
    weight: large
    tier: opus
    isolation: worktree
    scope:
      files:
        - src/styles/tokens.css
        - src/styles/global.css
        - src/styles/prose.css
        - src/layouts/**
        - src/components/**
        - src/pages/index.astro
        - src/assets/**            # logo svg, decorative assets
        - public/favicon.svg       # may refine the ∂ mark
      not:
        - content files (p3)
        - non-home pages (p4)
        - docs (p5)
        - rss/og (p6)
        - site.config.ts / content.config.ts (frozen)
    contracts: [c-design-tokens, c-components, c-site-config, c-content-schema, c-routes]
    skills: [/style-guide-typescript]
    brief: briefs/p2.md
    log: logs/2026-09-03-1300-cohomolo-gy-plan/agent-logs/p2/
    tests_first:
      - "Homepage builds with an empty posts collection (no crash on zero entries)"
      - "Theme toggle: with no localStorage key and prefers-color-scheme: light, html has no data-theme and light tokens apply; clicking sets data-theme and persists"
    verify:
      - cmd: npm run check
        expect: exit 0
      - cmd: npm run build
        expect: exit 0
      - cmd: grep -q 'data-theme' dist/index.html && grep -q 'Newsreader' dist/_astro/*.css
        expect: exit 0
      - cmd: npm run lint:links
        expect: exit 0

  - id: p3
    name: Seed content in Emily's voice
    kind: build
    depends_on: [p1]
    weight: large
    tier: opus
    isolation: worktree
    scope:
      files:
        - src/content/posts/**
        - src/content/notes/**
        - src/content/projects.yaml
        - src/content/talks.yaml
        - src/content/pages/about.md
        - src/content/posts/_assets/**   # images for the kitchen-sink post
      not:
        - templates (_template.md are p1's; do not edit)
        - anything outside src/content
    contracts: [c-content-schema]
    skills: []
    brief: briefs/p3.md
    log: logs/2026-09-03-1300-cohomolo-gy-plan/agent-logs/p3/
    tests_first:
      - "Every content file validates against the schema: `npm run check` and `npm run build` pass with p1's placeholder pages"
    verify:
      - cmd: npm run check
        expect: exit 0
      - cmd: npm run build
        expect: exit 0
      - cmd: "! grep -rilE 'claude|anthropic|chatgpt|openai|generated by|as an ai' src/content"
        expect: exit 0
      - cmd: "! grep -rilE 'Head of Core Engineering|Principal Engineer|Systems Engineer' src/content"
        expect: exit 0

  - id: p4
    name: Section pages and routes
    kind: build
    depends_on: [p2, p3]
    weight: large
    tier: opus
    isolation: worktree
    scope:
      files:
        - src/pages/posts/**
        - src/pages/notes/**
        - src/pages/tags/**
        - src/pages/projects/**
        - src/pages/talks/**
        - src/pages/about/**
        - src/pages/404.astro
      not:
        - src/pages/index.astro (p2)
        - src/pages/rss.xml.ts, src/pages/og/** (p6)
        - components/layouts/styles (p2) — compose, do not edit
        - content (p3)
    contracts: [c-routes, c-components, c-design-tokens, c-content-schema, c-site-config]
    skills: [/style-guide-typescript]
    brief: briefs/p4.md
    log: logs/2026-09-03-1300-cohomolo-gy-plan/agent-logs/p4/
    tests_first:
      - "Build produces dist/posts/kitchen-sink/index.html and no dist/posts/<draft>/ directory"
      - "Every tag on any published entry has a dist/tags/<tag>/index.html"
    verify:
      - cmd: npm run check
        expect: exit 0
      - cmd: npm run build
        expect: exit 0
      - cmd: for r in posts notes tags projects talks about; do test -f "dist/$r/index.html" || exit 1; done; test -f dist/404.html
        expect: exit 0
      - cmd: npm run lint:links
        expect: exit 0

  - id: p5
    name: README and docs
    kind: build
    depends_on: [p1]
    weight: medium
    tier: sonnet
    isolation: worktree
    scope:
      files:
        - README.md
        - docs/**
        - .github/dependabot.yml
        - .github/PULL_REQUEST_TEMPLATE.md   # optional, minimal
      not:
        - any code or content
    contracts: [c-content-schema, c-site-config, c-scripts, c-routes]
    skills: []
    brief: briefs/p5.md
    log: logs/2026-09-03-1300-cohomolo-gy-plan/agent-logs/p5/
    tests_first:
      - "Every command quoted in the docs exists in package.json scripts (checked by grep)"
    verify:
      - cmd: test -f README.md && test -f docs/WRITING.md && test -f docs/STYLING.md && test -f docs/DEPLOY.md && test -f docs/MAINTENANCE.md
        expect: exit 0
      - cmd: "! grep -rilE 'claude|anthropic|chatgpt|openai|generated by|as an ai' README.md docs"
        expect: exit 0
      - cmd: npx prettier --check README.md docs
        expect: exit 0

  - id: p6
    name: RSS feed and Open Graph images
    kind: build
    depends_on: [p1]
    weight: medium
    tier: opus
    isolation: worktree
    scope:
      files:
        - src/pages/rss.xml.ts
        - src/pages/og/**
        - src/lib/og.ts
        - src/lib/feed.ts
        - scripts/og-default.mjs
        - public/og/default.png
        - src/assets/og/**            # font files bundled for satori
        - package.json               # ADD dependencies only (satori, @resvg/resvg-js, sanitize-html, markdown-it + types)
        - package-lock.json
      not:
        - components/layouts/styles (p2) — p6 draws OG images with its own satori JSX, using c-design-tokens colours as literals
        - pages (p4)
    contracts: [c-routes, c-site-config, c-content-schema, c-design-tokens]
    skills: [/style-guide-typescript]
    brief: briefs/p6.md
    log: logs/2026-09-03-1300-cohomolo-gy-plan/agent-logs/p6/
    tests_first:
      - "rss.xml validates: well-formed XML, <rss version=\"2.0\">, one <item> per published post/note, links absolute and ending in /"
      - "og/posts/<id>.png is a 1200×630 PNG (check signature bytes + IHDR)"
    verify:
      - cmd: npm run check
        expect: exit 0
      - cmd: npm run build
        expect: exit 0
      - cmd: test -f dist/rss.xml && node -e "const s=require('fs').readFileSync('dist/rss.xml','utf8'); if(!/<rss[^>]*version=\"2.0\"/.test(s)) process.exit(1)"
        expect: exit 0
      - cmd: test -f public/og/default.png && node -e "const b=require('fs').readFileSync('public/og/default.png'); if(b.readUInt32BE(16)!==1200||b.readUInt32BE(20)!==630) process.exit(1)"
        expect: exit 0

  - id: p7
    name: Integration QA, accessibility, and visual pass
    kind: audit
    depends_on: [p2, p3, p4, p5, p6]
    weight: medium
    tier: opus
    isolation: in-place
    scope:
      files:
        - "**"                     # read everything; fix only within the findings it reports
      not:
        - redesign; new features
    contracts: [c-routes, c-design-tokens, c-components]
    skills: [/tech-ref-playwright, /tech-ref-owasp-top10]
    brief: briefs/p7.md
    log: logs/2026-09-03-1300-cohomolo-gy-plan/agent-logs/p7/
    coverage:
      - Every route in c-routes exists in dist/ and returns 200 under `astro preview`
      - No broken internal links or missing assets (lint:links + a Playwright crawl)
      - Both themes: contrast of text/muted/faint on bg ≥ WCAG AA (4.5:1 body, 3:1 large) — measured, not eyeballed
      - Keyboard: header nav, theme toggle, TOC, footer links reachable and visibly focused
      - No FOUC on theme; no layout shift from fonts (font-display: swap with size-adjusted fallbacks, or optional)
      - Lighthouse (mobile) ≥ 95 performance / accessibility / best-practices / SEO on / and /posts/kitchen-sink/
      - Markdown: KaTeX renders display + inline math; Shiki highlights Haskell and Lean; footnotes; tables; images; callouts via MDX
      - Metadata: title, description, canonical, OG image URL resolves, RSS autodiscovery, sitemap lists no drafts
      - Security headers appropriate for static hosting are documented (Pages sets few); no inline scripts beyond the theme script; no third-party requests at all
      - Screenshots of /, /posts/kitchen-sink/, /about/, /projects/ in both themes at 390px and 1280px saved to the log dir
    min_confidence: confirmed
    done_when:
      - Findings fixed in place where the fix is ≤ 20 lines and within a single package's scope; larger findings reported, not fixed
