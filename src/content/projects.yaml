# Projects shown on /projects/. Each item needs a unique `id`.
#
# `url` is the canonical landing page (Hackage where a package is published,
# otherwise the repository); `repo` is always the GitHub source.

- id: base64
  name: base64
  description: RFC 4648-compliant Base64 and Base64url for ByteString, Text, and their lazy and short variants. Faster than base64-bytestring, and it rejects encodings that do not round-trip.
  url: https://hackage.haskell.org/package/base64
  repo: https://github.com/emilypi/base64
  hackage: base64
  role: author
  status: maintained
  tags: [haskell, encoding]
  featured: true

- id: haskell-resources
  name: haskell-resources
  description: A curated list of links to the foundational Haskell papers, arranged by theme — monads and type classes, semantics, the STG machine, type systems, and where the sausage is made.
  url: https://github.com/cohomolo-gy/haskell-resources
  repo: https://github.com/cohomolo-gy/haskell-resources
  role: author
  status: maintained
  tags: [haskell, resources]
  featured: true

- id: smash
  name: smash
  description: Smash products, wedge products, and other pointed stuff — the pointed analogues of the usual product and sum, with the instances you would want.
  url: https://hackage.haskell.org/package/smash
  repo: https://github.com/emilypi/smash
  hackage: smash
  role: author
  status: maintained
  tags: [haskell, category-theory]
  featured: true

- id: nonempty-vector
  name: nonempty-vector
  description: Non-empty vectors — the total counterparts to head, last, and foldr1, with emptiness ruled out by the type rather than by a comment.
  url: https://hackage.haskell.org/package/nonempty-vector
  repo: https://github.com/emilypi/nonempty-vector
  hackage: nonempty-vector
  role: author
  status: maintained
  tags: [haskell, data-structures]
  featured: true

