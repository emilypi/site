- id: compositionality-2024
  title: Profunctor Optics, a Categorical Update
  kind: paper
  venue: Compositionality, vol. 6 (2024)
  date: 2024-02-23
  url: https://doi.org/10.32408/compositionality-6-1
  coauthors:
    - Bryce Clarke
    - Derek Elkins
    - Jeremy Gibbons
    - Fosco Loregiàn
    - Bartosz Milewski
    - Mario Román
  abstract: >-
    Optics are bidirectional data accessors that capture data transformation
    patterns such as accessing subfields or iterating over containers.
    Profunctor optics are a particular choice of representation supporting
    modularity, meaning that we can construct accessors for complex structures
    by combining simpler ones.

